<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KasKita - Pengelola Kas & Iuran Bulanan</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="h-full text-slate-800 antialiased flex flex-col font-sans select-none">
    
    <!-- HEADER & NAVIGASI -->
    <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-inner">
                        <i class="fa-solid fa-wallet"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg leading-tight" id="headerOrgName">KasKita</h1>
                        <p class="text-xs text-indigo-200 flex items-center gap-1">
                            <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
                            Aplikasi Kas Online
                        </p>
                    </div>
                </div>

                <div class="flex items-center space-x-1 sm:space-x-2">
                    <button type="button" onclick="openModal('modalSettings')" class="p-2 text-indigo-200 hover:text-white hover:bg-indigo-800 rounded-lg transition" title="Pengaturan">
                        <i class="fa-solid fa-gear text-lg"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- TAB MENU NAVIGASI -->
        <div class="bg-indigo-950 px-4 sm:px-6 lg:px-8 border-t border-indigo-800/50">
            <div class="max-w-7xl mx-auto flex space-x-1 overflow-x-auto py-2 custom-scrollbar text-sm font-medium">
                <button type="button" id="btn-tab-dashboard" onclick="switchTab('dashboard')" class="tab-btn px-4 py-2 rounded-lg text-white bg-indigo-700 whitespace-nowrap flex items-center gap-2 transition">
                    <i class="fa-solid fa-chart-pie"></i> Dashboard
                </button>
                <button type="button" id="btn-tab-iuran" onclick="switchTab('iuran')" class="tab-btn px-4 py-2 rounded-lg text-indigo-200 hover:text-white hover:bg-indigo-800/60 whitespace-nowrap flex items-center gap-2 transition">
                    <i class="fa-solid fa-calendar-check"></i> Matriks Iuran
                </button>
                <button type="button" id="btn-tab-transaksi" onclick="switchTab('transaksi')" class="tab-btn px-4 py-2 rounded-lg text-indigo-200 hover:text-white hover:bg-indigo-800/60 whitespace-nowrap flex items-center gap-2 transition">
                    <i class="fa-solid fa-list-check"></i> Transaksi
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENT BODY -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">

        <!-- TAB 1: DASHBOARD -->
        <div id="tab-dashboard" class="tab-content space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold uppercase text-slate-500 mb-1">Total Saldo Kas</p>
                        <h2 class="text-2xl font-bold text-slate-900" id="dashTotalSaldo">Rp 0</h2>
                    </div>
                    <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl">
                        <i class="fa-solid fa-vault"></i>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold uppercase text-slate-500 mb-1">Aksi Cepat</p>
                        <button onclick="openModal('modalTransaksi')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-4 py-2 rounded-xl font-semibold shadow transition">
                            + Catat Transaksi
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 2: MATRIKS IURAN -->
        <div id="tab-iuran" class="tab-content hidden space-y-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <h2 class="font-bold text-lg text-slate-800 mb-2">Matriks Setoran Iuran</h2>
                <p class="text-xs text-slate-500">Kelola setoran iuran anggota di sini.</p>
            </div>
        </div>

        <!-- TAB 3: TRANSAKSI -->
        <div id="tab-transaksi" class="tab-content hidden space-y-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <h2 class="font-bold text-lg text-slate-800 mb-2">Riwayat Transaksi Kas</h2>
                <p class="text-xs text-slate-500">Daftar pemasukan dan pengeluaran kas.</p>
            </div>
        </div>

    </main>

    <!-- MODAL TRANSAKSI -->
    <div id="modalTransaksi" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
            <div class="flex items-center justify-between border-b pb-3 mb-4">
                <h3 class="font-bold text-slate-800 text-base">Tambah Transaksi</h3>
                <button onclick="closeModal('modalTransaksi')" class="text-slate-400 hover:text-slate-600 text-lg font-bold p-1">&times;</button>
            </div>
            <form id="formTransaksi" onsubmit="simpanTransaksi(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Nominal (Rp)</label>
                    <input type="number" required id="txNominal" class="w-full border rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="100000">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Keterangan</label>
                    <input type="text" required id="txKet" class="w-full border rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Iuran Bulanan / Beli Perlengkapan">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal('modalTransaksi')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold transition">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold transition">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL PENGATURAN -->
    <div id="modalSettings" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
            <div class="flex items-center justify-between border-b pb-3 mb-4">
                <h3 class="font-bold text-slate-800 text-base">Pengaturan Kas</h3>
                <button onclick="closeModal('modalSettings')" class="text-slate-400 hover:text-slate-600 text-lg font-bold p-1">&times;</button>
            </div>
            <p class="text-xs text-slate-600 mb-4">Pengaturan kas dan reset data lokal.</p>
            <div class="flex justify-end">
                <button type="button" onclick="closeModal('modalSettings')" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold">Tutup</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT JAVASCRIPT UTAMA (NAVIGASI & MODAL) -->
    <script>
        // Fungsi Pindah Tab Navigasi
        function switchTab(tabName) {
            // Sembunyikan semua tab content
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(el => el.classList.add('hidden'));

            // Reset warna tombol tab
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-indigo-700', 'text-white');
                btn.classList.add('text-indigo-200');
            });

            // Tampilkan tab yang dipilih
            const activeContent = document.getElementById('tab-' + tabName);
            if (activeContent) {
                activeContent.classList.remove('hidden');
            }

            // Highlighting tombol aktif
            const activeBtn = document.getElementById('btn-tab-' + tabName);
            if (activeBtn) {
                activeBtn.classList.remove('text-indigo-200');
                activeBtn.classList.add('bg-indigo-700', 'text-white');
            }
        }

        // Fungsi Buka Modal
        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.remove('hidden');
            }
        }

        // Fungsi Tutup Modal
        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.add('hidden');
            }
        }

        // Simpan Transaksi Sederhana
        function simpanTransaksi(event) {
            event.preventDefault();
            alert('Transaksi berhasil disimpan!');
            closeModal('modalTransaksi');
        }

        // Tutup modal jika user mengeklik di luar kotak modal
        window.onclick = function(event) {
            if (event.target.classList.contains('fixed')) {
                event.target.classList.add('hidden');
            }
        };
    </script>
</body>
</html>
